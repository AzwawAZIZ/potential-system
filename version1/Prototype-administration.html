<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#002E5A" />

    />
    <title>Suivi MIAGE · UPJV</title>
    <style>:root {
  --navy: #002e5a;
  --primary: #16588b;
  --primary-hover: #104875;
  --accent: #16588b;
  --bg: #f4f7fb;
  --surface: #fff;
  --surface2: #f8fafc;
  --border: #e5ebf1;
  --text: #172c46;
  --muted: #627388;
  --green: #167447;
  --green-bg: #e9f7ef;
  --amber: #94601c;
  --amber-bg: #fff5e5;
  --red: #b33328;
  --red-bg: #fff0ee;
  --shadow: 0 3px 12px #19355004;
  --sidebar: 252px;
  color-scheme: light;
}
[data-theme="dark"] {
  --navy: #d1e6ff;
  --primary: #83bdee;
  --primary-hover: #a1d3fa;
  --bg: #101a27;
  --surface: #172536;
  --surface2: #1b2d41;
  --border: #2b3f55;
  --text: #e6eef8;
  --muted: #b0c0d1;
  --green: #7bd5a9;
  --green-bg: #183b30;
  --amber: #f2c078;
  --amber-bg: #3f3320;
  --red: #ffa89d;
  --red-bg: #422926;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button,
input,
select,
textarea {
  font: inherit;
}
button,
a,
input,
select,
textarea {
  outline-offset: 4px;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid #2d78ad;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}
a {
  color: var(--primary);
}
svg {
  width: 19px;
  height: 19px;
  stroke-width: 1.7;
  vertical-align: middle;
  flex: none;
}
button {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface);
  color: var(--text);
  padding: 9px 13px;
  font-weight: 550;
  line-height: 1.4;
  transition:
    background 0.15s,
    box-shadow 0.15s;
}
button:hover {
  background: var(--surface2);
  border-color: #b5c8d8;
}
.primary {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--surface);
}
.primary:hover {
  background: var(--primary-hover);
  color: var(--surface);
}
.danger {
  color: var(--red);
  border-color: var(--red);
}
.quiet {
  background: transparent;
  border-color: transparent;
}
.link {
  color: var(--primary);
  border: 0;
  background: none;
  padding: 4px 0;
}
.small {
  font-size: 12px;
  padding: 6px 9px;
}
.icon-btn {
  width: 37px;
  height: 37px;
  padding: 8px;
}
.muted {
  color: var(--muted);
}
.eyebrow {
  text-transform: uppercase;
  letter-spacing: 1.7px;
  font-size: 10px;
  font-weight: 750;
  color: var(--muted);
}
h1,
h2,
h3,
h4,
p {
  margin: 0;
}
h1 {
  font-size: 28px;
  letter-spacing: -0.8px;
  font-weight: 650;
  line-height: 1.3;
}
h2 {
  font-size: 16px;
  letter-spacing: -0.2px;
  font-weight: 650;
}
h3 {
  font-size: 14px;
  font-weight: 650;
}
p {
  line-height: 1.65;
}
.subtext {
  color: var(--muted);
  margin-top: 7px;
  font-size: 13px;
}
.skip {
  position: fixed;
  top: -70px;
  z-index: 100;
}
.skip:focus {
  top: 5px;
  background: var(--surface);
  padding: 12px;
}
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar);
  background: var(--surface);
  border-right: 1px solid var(--border);
  z-index: 30;
  display: flex;
  flex-direction: column;
  padding: 30px 17px 17px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 10px;
}
.brandmark {
  width: 38px;
  height: 41px;
  background: #002e5a;
  color: white;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 0 0 1px #ffffff22;
}
.brandmark svg {
  height: 26px;
  width: 26px;
}
.brand-name {
  font-size: 19px;
  letter-spacing: -0.6px;
  font-weight: 750;
  color: var(--navy);
}
.brand-caption {
  font-size: 9px;
  letter-spacing: 1.45px;
  color: var(--muted);
  margin-top: 1px;
}
.workspace {
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 12px 10px;
  margin: 29px 6px 25px;
  background: var(--surface2);
}
.workspace-icon {
  border-radius: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 6px;
  color: var(--primary);
}
.workspace strong {
  display: block;
  font-size: 12px;
}
.workspace span {
  font-size: 11px;
  color: var(--muted);
}
.nav-label {
  padding: 0 13px 9px;
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 1.5px;
}
.nav {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.nav button {
  justify-content: flex-start;
  border: 0;
  background: none;
  padding: 11px 13px;
  color: var(--muted);
  font-size: 13px;
  white-space: nowrap;
}
.nav button.active {
  background: #eaf2fa;
  color: #16588b;
  font-weight: 650;
}
.nav button:hover {
  background: var(--surface2);
}
.nav .count {
  margin-left: auto;
  background: var(--surface);
  color: var(--muted);
  font-size: 10px;
  border: 1px solid var(--border);
  padding: 1px 6px;
  border-radius: 4px;
}
.sidebar-foot {
  margin-top: auto;
}
.demo-card {
  background: var(--surface2);
  padding: 15px;
  border: 1px solid var(--border);
  border-radius: 9px;
  margin: 15px 4px;
}
.demo-card p {
  font-size: 11px;
  color: var(--muted);
  margin: 6px 0 10px;
}
.demo-card button {
  font-size: 11px;
  width: 100%;
  padding: 8px;
}
.university {
  padding: 17px 10px 0;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 9px;
  align-items: center;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.5;
}
.university strong {
  font-family: Georgia, serif;
  font-size: 22px;
  color: var(--navy);
  letter-spacing: -1px;
}
.shell {
  margin-left: var(--sidebar);
}
.topbar {
  height: 77px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 34px;
  gap: 15px;
  position: sticky;
  top: 0;
  z-index: 20;
}
.breadcrumb {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 12px;
}
.breadcrumb strong {
  color: var(--text);
  font-weight: 550;
}
.top-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.year {
  font-size: 11px;
  color: var(--muted);
  padding-right: 14px;
  border-right: 1px solid var(--border);
}
.role-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 4px 8px;
  color: var(--accent);
  font-size: 10px;
  font-weight: 650;
  background: var(--surface2);
}
.role-pill:before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
}
.avatar {
  height: 33px;
  width: 33px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #eaf0f7;
  color: #295780;
  font-size: 11px;
  font-weight: 650;
  flex: none;
}
.avatar.amber {
  background: var(--amber-bg);
  color: var(--amber);
}
.avatar.green {
  background: var(--green-bg);
  color: var(--green);
}
.avatar.purple {
  background: #f0eafb;
  color: #7044a6;
}
.profile-btn {
  padding: 0 0 0 12px;
  border: 0;
  border-left: 1px solid var(--border);
  border-radius: 0;
  text-align: left;
  gap: 9px;
}
.profile-btn strong {
  font-size: 11px;
  display: block;
}
.profile-btn small {
  font-size: 10px;
  color: var(--muted);
  font-weight: 400;
}
.bell {
  position: relative;
}
.dot-count {
  position: absolute;
  right: 1px;
  top: -1px;
  background: #bd4b36;
  color: #fff;
  min-width: 14px;
  height: 14px;
  font-size: 8px;
  border-radius: 8px;
  border: 2px solid var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
}
.main {
  padding: 30px 34px 24px;
  max-width: 1640px;
  margin: auto;
}
.page-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 26px;
}
.page-head .eyebrow {
  margin-bottom: 7px;
}
.head-actions {
  display: flex;
  gap: 9px;
  align-items: center;
}
.date-label {
  font-size: 11px;
  color: var(--muted);
  display: flex;
  gap: 6px;
  align-items: center;
}
.section-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 15px;
}
.section-title {
  display: flex;
  gap: 9px;
  align-items: center;
}
.section-title svg {
  color: var(--primary);
  width: 17px;
}
.section-tag {
  font-size: 10px;
  color: var(--red);
  background: var(--red-bg);
  padding: 2px 7px;
  border-radius: 4px;
}
.urgent-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 25px;
}
.urgent {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  text-align: left;
  border: 1px solid var(--border);
  background: var(--surface);
  box-shadow: var(--shadow);
  border-radius: 9px;
  padding: 17px 18px;
  min-height: 153px;
  position: relative;
  overflow: hidden;
}
.urgent:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px #1935500c;
}
.urgent-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.urgent-icon {
  height: 32px;
  width: 32px;
  border-radius: 7px;
  display: grid;
  place-items: center;
  background: #eaf2fa;
  color: #16588b;
}
.urgent-icon.amber {
  background: var(--amber-bg);
  color: var(--amber);
}
.urgent-icon.red {
  background: var(--red-bg);
  color: var(--red);
}
.urgent-icon.purple {
  background: #f2edfa;
  color: #7549a7;
}
.urgent-number {
  font-size: 28px;
  font-weight: 650;
  letter-spacing: -1px;
  line-height: 1;
}
.urgent strong {
  font-size: 12px;
  font-weight: 600;
}
.urgent-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 9px;
  font-size: 10px;
  font-weight: 400;
  color: var(--muted);
}
.urgent-foot svg {
  width: 14px;
  height: 14px;
}
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.panel-head {
  padding: 19px 21px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.panel-body {
  padding: 20px 21px;
}
.dashboard-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 21px;
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.tabs {
  display: flex;
  gap: 23px;
  border-bottom: 1px solid var(--border);
  padding: 0 21px;
  overflow: auto;
}
.tabs button {
  border: 0;
  border-radius: 0;
  background: none;
  color: var(--muted);
  padding: 13px 0;
  font-size: 12px;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
}
.tabs button[aria-selected="true"] {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: 650;
}
.tabs .badge {
  margin-left: 1px;
}
.table-wrap {
  width: 100%;
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  white-space: nowrap;
}
th {
  font-size: 10px;
  font-weight: 550;
  color: var(--muted);
  background: var(--surface2);
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
}
td {
  font-size: 12px;
  padding: 15px 18px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
tbody tr:last-child td {
  border-bottom: 0;
}
tr.clickable {
  cursor: pointer;
}
tr.clickable:hover {
  background: var(--surface2);
}
.person {
  display: flex;
  align-items: center;
  gap: 10px;
}
.person strong {
  display: block;
  font-size: 12px;
  font-weight: 600;
}
.person small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  margin-top: 2px;
}
.person .avatar {
  height: 31px;
  width: 31px;
  font-size: 10px;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 4px;
  padding: 3px 7px;
  background: var(--surface2);
  font-size: 10px;
  font-weight: 550;
  color: var(--muted);
  white-space: nowrap;
}
.badge.green {
  color: var(--green);
  background: var(--green-bg);
}
.badge.amber {
  color: var(--amber);
  background: var(--amber-bg);
}
.badge.red {
  color: var(--red);
  background: var(--red-bg);
}
.badge.blue {
  color: var(--primary);
  background: #eaf2fa;
}
.badge.purple {
  color: #7549a7;
  background: #f2edfa;
}
.badge-dot:before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
}
.mini-pipeline {
  display: flex;
  gap: 3px;
  margin: 4px 0 5px;
}
.mini-pipeline i {
  width: 15px;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
}
.mini-pipeline i.filled {
  background: #579d85;
}
.table-footer {
  border-top: 1px solid var(--border);
  padding: 13px 20px;
  color: var(--muted);
  font-size: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.alert-row {
  padding: 15px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 11px;
  align-items: flex-start;
}
.alert-row:first-child {
  padding-top: 0;
}
.alert-row:last-child {
  border: 0;
  padding-bottom: 0;
}
.alert-icon {
  height: 29px;
  width: 29px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  background: var(--amber-bg);
  color: var(--amber);
  flex: none;
}
.alert-icon.red {
  background: var(--red-bg);
  color: var(--red);
}
.alert-icon svg {
  width: 15px;
}
.alert-content {
  flex: 1;
}
.alert-content h3 {
  font-size: 11px;
  margin-bottom: 4px;
}
.alert-content p {
  font-size: 10px;
  color: var(--muted);
  line-height: 1.6;
}
.alert-content button {
  font-size: 10px;
  margin-top: 7px;
}
.metric-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.metric {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 9px;
  padding: 17px;
}
.metric-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--muted);
  font-size: 11px;
}
.metric-top svg {
  width: 16px;
}
.metric-value {
  font-size: 25px;
  font-weight: 650;
  letter-spacing: -0.6px;
  margin-top: 7px;
  display: flex;
  gap: 8px;
  align-items: baseline;
}
.metric-value small {
  font-size: 10px;
  font-weight: 450;
  letter-spacing: 0;
  color: var(--green);
}
.metric p {
  font-size: 10px;
  color: var(--muted);
  margin-top: 4px;
}
.metrics-section {
  margin-top: 26px;
}
.workload {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 16px 0;
}
.workload:first-child {
  margin-top: 0;
}
.workload:last-child {
  margin-bottom: 0;
}
.workload-info {
  flex: 1;
  font-size: 11px;
}
.workload-head {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
}
.bar {
  height: 5px;
  background: var(--border);
  border-radius: 5px;
  overflow: hidden;
}
.bar span {
  display: block;
  height: 100%;
  background: #4b8ba9;
  border-radius: 5px;
}
.fineprint {
  font-size: 10px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  margin-top: 25px;
}
.activity {
  display: flex;
  gap: 11px;
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
}
.activity:last-child {
  border-bottom: 0;
}
.activity p {
  font-size: 12px;
}
.activity small {
  font-size: 10px;
  color: var(--muted);
}
.filters {
  display: flex;
  gap: 9px;
  padding: 15px 20px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  align-items: end;
}
.filters label {
  font-size: 10px;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.filters select {
  min-width: 125px;
  max-width: 205px;
  font-size: 11px;
  padding: 8px 27px 8px 9px;
  background-color: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
}
.filters .reset {
  margin-left: auto;
  font-size: 11px;
}
.notice {
  display: flex;
  gap: 11px;
  border: 1px solid var(--border);
  background: var(--surface2);
  padding: 14px 17px;
  border-radius: 8px;
  font-size: 12px;
  margin-bottom: 20px;
}
.notice svg {
  color: var(--primary);
  margin-top: 2px;
}
.notice.amber {
  background: var(--amber-bg);
  border-color: #e3c78d;
  color: var(--amber);
}
.notice.red {
  background: var(--red-bg);
  color: var(--red);
  border-color: #eab2a9;
}
.notice.green {
  background: var(--green-bg);
  color: var(--green);
  border-color: #b5d9c8;
}
.notice p {
  font-size: 11px;
  margin-top: 3px;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.between {
  justify-content: space-between;
}
.wrap {
  flex-wrap: wrap;
}
.mt {
  margin-top: 20px;
}
.mb {
  margin-bottom: 20px;
}
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.grid3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
.student-card {
  padding: 21px;
}
.student-card .person {
  margin-bottom: 18px;
}
.student-card p {
  font-size: 12px;
  color: var(--muted);
}
.student-card button {
  margin-top: 18px;
  width: 100%;
  font-size: 12px;
}
.pipeline {
  display: flex;
  gap: 0;
  overflow-x: auto;
  padding: 25px 0;
}
.pipeline-step {
  min-width: 90px;
  flex: 1;
  text-align: center;
  position: relative;
  font-size: 10px;
  color: var(--muted);
}
.pipeline-step:before {
  content: "";
  position: absolute;
  height: 2px;
  background: var(--border);
  left: 0;
  right: 0;
  top: 13px;
}
.pipeline-step:first-child:before {
  left: 50%;
}
.pipeline-step:last-child:before {
  right: 50%;
}
.pipeline-step i {
  position: relative;
  font-style: normal;
  display: grid;
  place-items: center;
  margin: 0 auto 10px;
  width: 27px;
  height: 27px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--muted);
  font-size: 11px;
}
.pipeline-step.done i {
  color: var(--green);
  background: var(--green-bg);
  border-color: var(--green);
}
.pipeline-step.current i {
  color: white;
  background: #16588b;
  border-color: #16588b;
  box-shadow: 0 0 0 4px #16588b15;
}
.pipeline-step.current {
  color: var(--primary);
  font-weight: 650;
}
.timeline {
  padding-left: 15px;
}
.timeline-item {
  border-left: 1px solid var(--border);
  padding: 0 0 24px 26px;
  position: relative;
}
.timeline-item:before {
  content: "";
  position: absolute;
  width: 10px;
  height: 10px;
  border: 3px solid var(--surface);
  background: #598fac;
  border-radius: 50%;
  left: -8px;
  top: 5px;
  box-shadow: 0 0 0 1px var(--border);
}
.timeline-item.deposit:before {
  background: #3c9b78;
}
.timeline-date {
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 6px;
}
.timeline-item details {
  padding: 13px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 7px;
}
.timeline-item summary {
  cursor: pointer;
  font-size: 12px;
  font-weight: 550;
}
.timeline-item p {
  font-size: 12px;
  margin-top: 12px;
  white-space: pre-line;
}
.timeline-item .badge {
  margin-left: 7px;
}
.backdrop {
  position: fixed;
  inset: 0;
  background: #071a32aa;
  z-index: 70;
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal {
  width: min(620px, 100%);
  max-height: 90vh;
  overflow-y: auto;

}
.modal.wide {

}
.dialog-head {
  padding: 22px 24px;

  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.dialog-body {
  padding: 23px 24px;
}
.dialog-foot {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  background: var(--surface2);
}
.drawer-backdrop {
  justify-content: flex-end;
  padding: 0;
}
.drawer {
  height: 100%;
  width: min(520px, 100%);
  background: var(--surface);

  animation: slide 0.2s ease;
}
.drawer .dialog-head {

}
.drawer .dialog-body {

}
.form-grid {

  gap: 16px;
}
.field {

  font-weight: 550;
  min-width: 0;
}
.field.full {
  grid-column: 1/-1;
}
.field small {
  font-size: 10px;
  color: var(--muted);
  font-weight: 400;
}
input:not([type="checkbox"]):not([type="radio"]),
textarea,
select.field-control {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 11px;
  background: var(--surface);

}
textarea {

  line-height: 1.7;
}
input[type="checkbox"] {

  height: 15px;
  flex: none;
}
input[type="radio"] {

}
.check-label {
  display: flex;
  align-items: flex-start;
  gap: 8px;

  margin: 9px 0;
}
.check-label input {
  margin-top: 3px;
}
.form-section {

  font-weight: 650;
  color: var(--primary);

}
.form-section:first-child {
  margin-top: 0;
}
.form-error {
  border-radius: 6px;
  padding: 11px 13px;

  color: var(--red);

  margin-bottom: 15px;
}
.form-error:empty {

}
#toast {
  position: fixed;
  bottom: 25px;

}

}
.empty {
  text-align: center;
  padding: 45px 20px;
  color: var(--muted);
}
.empty > svg {
  width: 33px;
  height: 33px;
  margin-bottom: 10px;
  color: var(--primary);
}
.empty h3 {
  color: var(--text);
  margin-bottom: 6px;
}
.empty p {
  font-size: 12px;
  max-width: 340px;
  margin: auto;
}
.empty button {
  margin-top: 17px;
}
.demo-account {
  width: 100%;
  justify-content: flex-start;
  gap: 11px;
  text-align: left;
  padding: 13px;
  margin-bottom: 9px;
}
.demo-account span {
  display: block;
}
.demo-account strong {
  font-size: 12px;
}
.demo-account small {
  display: block;
  font-size: 10px;
  font-weight: 400;
  color: var(--muted);
  margin-top: 3px;
}
.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
.detail-grid dt {
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 4px;
}
.detail-grid dd {
  margin: 0;
  font-size: 12px;
}
.login {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.05fr 1fr;
}
.login-art {
  background: #002e5a;

  padding: 50px 65px;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}
.login-art .brand-name,
.login-art .brand-caption {
  color: white;
}
.login-art .brand {
  padding: 0;
}
.login-art .brandmark {
  background: #ffffff15;
  border: 1px solid #ffffff33;
}
.login-message {
  margin: auto 0;
  position: relative;
  z-index: 1;
}
.login-message h1 {
  font-size: 47px;

  margin: 18px 0 24px;
}
.login-message p {
  color: #bdd0e6;
  max-width: 390px;
  font-size: 15px;
}
.login-kicker {
  color: #a5c5e5;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.login-visual {
  display: flex;
  gap: 8px;
  margin: 40px 0;
}
.login-visual i {
  width: 54px;
  height: 5px;
  background: #ffffff20;
  border-radius: 5px;
}
.login-visual i:nth-child(-n + 4) {
  background: #8fbfd6;
}
.login-art:after {
  content: "";
  position: absolute;
  width: 650px;
  height: 650px;
  border: 1px solid #ffffff12;
  border-radius: 50%;
  right: -330px;
  bottom: -210px;
  box-shadow:
    0 0 0 65px #ffffff04,
    0 0 0 130px #ffffff03,
    0 0 0 195px #ffffff03;
}
.login-foot {
  font-size: 11px;
  color: #a9c4df;
  display: flex;
  gap: 8px;
}
.login-form-side {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}
.login-form {
  max-width: 370px;
  width: 100%;
}
.login-form h1 {
  margin: 12px 0 8px;
  font-size: 29px;
}
.login-form form {
  margin-top: 30px;
}
.login-form .field {
  margin-bottom: 18px;
}
.login-form .primary {
  width: 100%;
  padding: 12px;
}
.login-form .demo-note {
  padding: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin: 23px 0;
  font-size: 11px;
  color: var(--muted);
}
.stepper {
  display: flex;
  gap: 13px;
  margin-bottom: 25px;
}
.wizard-step {
  flex: 1;
  border-top: 3px solid var(--border);
  padding-top: 12px;
  font-size: 12px;
  color: var(--muted);
}
.wizard-step.active {
  border-color: var(--primary);
  color: var(--primary);
}
.upload-area {
  border: 1px dashed #a8bfd1;
  border-radius: 9px;
  padding: 30px;
  text-align: center;
  background: var(--surface2);
}
.upload-area p {
  font-size: 12px;
  color: var(--muted);
  margin: 9px 0 16px;
}
.upload-area svg {
  width: 30px;
  height: 30px;
  color: var(--primary);
}
.upload-area input {
  margin-top: 12px;
}
.matrix th,
.matrix td {
  text-align: center;
}
.matrix th:first-child,
.matrix td:first-child {
  text-align: left;
  position: sticky;
  left: 0;
  background: var(--surface);
  min-width: 225px;
}
.matrix td {
  padding: 13px;
}
.lock-cell {
  border: 0;
  background: none;
  color: var(--muted);
  padding: 4px;
}
.matrix label {
  font-size: 10px;
  color: var(--muted);
}
.change-bar {
  position: sticky;
  bottom: 12px;
  padding: 15px 20px;
  border-radius: 9px;
  background: #002e5a;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 15px;
  box-shadow: 0 5px 20px #002e5a33;
  z-index: 10;
}
.change-bar button {
  background: white;
  color: #002e5a;
}
.compare {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}
.compare > div {
  padding: 15px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface2);
}
pre {
  white-space: pre-wrap;
  font: 12px/1.8 inherit;
  color: var(--text);
  margin: 12px 0;
}
.crv-text {
  white-space: pre-line;
  font-size: 13px;
  line-height: 2;
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface2);
}
.visa-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 23px;
}
.visa-step {
  padding: 15px;
  border: 1px solid var(--border);
  border-radius: 7px;
  font-size: 12px;
  background: var(--surface2);
}
.visa-step.done {
  border-color: #9acbb4;
  background: var(--green-bg);
  color: var(--green);
}
.visa-step strong {
  display: block;
  font-size: 11px;
  margin-bottom: 5px;
}
.chat-message {
  max-width: 85%;
  margin-bottom: 16px;
}
.chat-message.mine {
  margin-left: auto;
}
.chat-message small {
  font-size: 10px;
  color: var(--muted);
}
.chat-bubble {
  padding: 13px 16px;
  border: 1px solid var(--border);
  border-radius: 0 9px 9px 9px;
  background: var(--surface2);
  font-size: 12px;
  margin-top: 5px;
  white-space: pre-wrap;
}
.mine .chat-bubble {
  background: #eaf2fa;
  color: #174875;
  border-color: #d6e5f1;
  border-radius: 9px 0 9px 9px;
}
.chat-area {
  min-height: 220px;
  max-height: 450px;
  overflow-y: auto;
}
.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.calendar-controls {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.cal-day {
  min-height: 62px;
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: 5px;
  font-size: 10px;
}
.cal-day.event {
  background: var(--green-bg);
  color: var(--green);
}
.cal-day strong {
  display: block;
}
.cal-head {
  text-align: center;
  font-size: 10px;
  color: var(--muted);
  padding: 6px;
}
.system-strip {
  font-size: 10px;
  padding: 8px 15px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 5px;
  margin-bottom: 20px;
  background: var(--surface);
}
.mobile-menu {
  display: none;
}
.footer-lock {
  display: flex;
  align-items: center;
  gap: 5px;
}
.footer-lock svg {
  width: 12px;
  height: 12px;
}
.availability {
  display: flex;
  gap: 15px;
  align-items: center;
  padding: 13px 18px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  margin-bottom: 24px;
  font-size: 12px;
}
.availability input[type="number"] {
  width: 60px;
  padding: 5px;
}
.notification.unread {
  background: var(--surface2);
  border-left: 3px solid var(--primary);
}
.notification {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}
.notification p {
  font-size: 12px;
}
.no-motion *,
html.no-motion * {
  animation: none !important;
  transition: none !important;
  scroll-behavior: auto !important;
}
@keyframes slide {
  from {
    transform: translateX(40px);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}
@media (min-width: 1600px) {
  .main {
    padding: 38px 45px;
  }
  .urgent {
    min-height: 165px;
  }
}
@media (max-width: 1200px) {
  :root {
    --sidebar: 220px;
  }
  .sidebar {
    padding-left: 10px;
    padding-right: 10px;
  }
  .main {
    padding: 25px;
  }
  .topbar {
    padding: 0 25px;
  }
  .dashboard-grid {
    grid-template-columns: minmax(0, 1fr) 280px;
  }
  .year {
    display: none;
  }
  .role-pill {
    max-width: 150px;
  }
  .urgent {
    padding: 15px;
  }
  .grid3 {
    grid-template-columns: repeat(2, 1fr);
  }
}
@media (max-width: 1000px) {
  .dashboard-grid {
    grid-template-columns: 1fr;
  }
  .dashboard-grid > .stack {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .profile-btn > span:not(.avatar) {
    display: none;
  }
  .urgent-grid {
    gap: 10px;
  }
  .urgent strong {
    font-size: 11px;
  }
  .role-pill {
    font-size: 9px;
  }
  .metric-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
@media (max-width: 760px) {
  :root {
    --sidebar: 0px;
  }
  .sidebar {
    width: 252px;
    transform: translateX(-100%);
    visibility: hidden;
    transition: transform 0.2s;
  }
  .sidebar.open {
    visibility: visible;
    transform: translateX(0);
    box-shadow: 10px 0 60px #001c3444;
  }
  .shell {
    margin: 0;
  }
  .mobile-menu {
    display: flex;
  }
  .topbar {
    height: 65px;
    padding: 0 16px;
  }
  .breadcrumb {
    gap: 7px;
  }
  .breadcrumb > span:first-child,
  .breadcrumb > svg {
    display: none;
  }
  .top-right {
    gap: 5px;
  }
  .top-right > .role-pill {
    display: none;
  }
  .main {
    padding: 23px 16px;
  }
  .page-head {
    align-items: flex-start;
    margin-bottom: 22px;
    gap: 12px;
  }
  .page-head h1 {
    font-size: 24px;
  }
  .page-head .head-actions {
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .date-label {
    display: none;
  }
  .head-actions button {
    font-size: 11px;
  }
  .urgent-grid {
    grid-template-columns: 1fr 1fr;
  }
  .urgent {
    min-height: 145px;
  }
  .dashboard-grid > .stack {
    display: flex;
  }
  .metric-grid {
    gap: 10px;
  }
  .grid2,
  .grid3 {
    grid-template-columns: 1fr;
  }
  .fineprint {
    gap: 15px;
  }
  .login {
    grid-template-columns: 1fr;
  }
  .login-art {
    display: none;
  }
  .login-form-side {
    padding: 30px 23px;
  }
  .login-form {
    max-width: 400px;
  }
  .form-grid {
    grid-template-columns: 1fr;
  }
  .compare {
    grid-template-columns: 1fr;
  }
  .visa-grid {
    gap: 7px;
  }
  .visa-step {
    padding: 10px;
    font-size: 10px;
  }
  .tabs {
    gap: 20px;
  }
  .panel-head {
    padding: 16px;
  }
  .panel-body {
    padding: 16px;
  }
  .availability {
    flex-wrap: wrap;
  }
  .filters {
    padding: 12px;
  }
  .filters label {
    flex: 1;
    min-width: 120px;
  }
  .filters select {
    min-width: 100%;
    max-width: 100%;
  }
  .filters .reset {
    margin-left: 0;
  }
  .detail-grid {
    gap: 15px;
  }
  .modal {
    max-height: 95vh;
  }
  .backdrop {
    padding: 10px;
  }
  .drawer-backdrop {
    padding: 0;
  }
  .dialog-body,
  .dialog-head {
    padding: 20px;
  }
  .stepper {
    gap: 7px;
  }
  .wizard-step {
    font-size: 10px;
  }
  #toast {
    left: 50%;
    width: 90%;
    text-align: center;
  }
  .table-footer {
    gap: 10px;
  }
  .year {
    display: none;
  }
  .brand-name {
    font-size: 19px;
  }
}
@media print {
  .sidebar,
  .topbar,
  .head-actions,
  .filters,
  button,
  .fineprint,
  .skip {
    display: none !important;
  }
  .shell {
    margin: 0;
  }
  .main {
    padding: 0;
  }
  body {
    background: white;
    color: #172c46;
  }
  .panel {
    break-inside: avoid;
    border-color: #ccc;
    box-shadow: none;
  }
  .table-wrap {
    overflow: visible;
  }
  table {
    white-space: normal;
  }
  .tabs {
    display: none;
  }
  .backdrop {
    position: static;
    background: white;
    padding: 0;
  }
  .drawer,
  .modal {
    width: 100%;
    height: auto;
    max-height: none;
    box-shadow: none;
  }
  .notice {
    break-inside: avoid;
  }
}
[data-theme="dark"] .badge.blue {
  color: #a6d2f3;
  background: #203e57;
}
[data-theme="dark"] .role-pill {
  color: color-mix(in srgb, var(--accent), white 60%);
}
[data-theme="dark"] .form-section {
  color: var(--primary);
}
[data-theme="dark"] .nav button.active,
[data-theme="dark"] .nav button.active:hover {
  color: #bfddf5;
  background: #223e58;
}
.pipeline:focus-visible,
.table-wrap:focus-visible {
  outline: 3px solid var(--primary);
  outline-offset: -3px;
}
.student-card .pipeline {
  padding-top: 24px;
  padding-bottom: 15px;
}
.student-card .pipeline-step {
  min-width: 64px;
  font-size: 9px;
}
.student-card .pipeline-step i {
  height: 23px;

    return Number.isInteger(record.cycle) && record.cycle > 0
      ? record.cycle

    student.cycle === 1 &&
    !s.history.some((h) => h.type === "Contrat archivé" && h.student === student.id)

  const u = activeUser(s), r = s.session?.role;

    !can(r, fn, s)

    if (studentId != null && record.student !== studentId) return false;

    const matches = s.students.filter((d) => d.id === record.student);

    const cycle = recordCycle(s, record, student);

    // dans les affectations actuelles ni dans une liste de salon périmée.

      h.type === "Contrat archivé" && h.student === student.id &&
      h.before?.id === student.id && h.before?.cycle === cycle

  if (["conflit", "conflit avec l’entreprise"].includes(key)) return "En conflit avec l’entreprise";
  return STUDENT_STATUSES.find((status) => statusKey(status) === key);
}
const CSV_REQUIRED = ["nom", "email", "promotion"];
const CSV_LIMIT = 10000;
const CSV_EMAIL =
  /^[^\s@()<>\[\],;:\\"\x00-\x1f\x7f-\x9f]+@[^\s@()<>\[\],;:\\"\x00-\x1f\x7f-\x9f]+$/u;
// Un défaut de structure découvert à l’analyse ne disparaît pas si l’aperçu est modifié.
const csvSyntaxErrors = new WeakMap();
const csvPreview = new WeakMap();
const importReasons = new Set([
  "CSV mal formé : guillemets invalides",
  "CSV mal formé : nombre de colonnes incorrect",
  "Nom manquant",
  "Nom invalide",
  "E-mail invalide",
  "Promotion attendue : M1 ou M2",
  "Ville invalide",
  "Statut étudiant inconnu",
  "Doublon dans le fichier",
  "E-mail ambigu dans les dossiers existants",
  "E-mail ambigu dans les comptes existants",
  "Identifiant de dossier existant incohérent",
  "E-mail déjà utilisé par un compte non lié",
  "Compte étudiant lié incohérent",
  "Nom différent du compte étudiant lié",
  "Ligne ou identité modifiée depuis l’aperçu",
  "Ligne rejetée à l’aperçu",
]);

function parseCSVLine(line, sep) {
  const values = [];
  let value = "",
    state = "start",
    error = "";
  const push = () => {
    values.push(value.trim());
    value = "";
    state = "start";
  };
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (state === "quoted") {
      if (c === '"' && line[i + 1] === '"') {
        value += '"';
        i++;
      } else if (c === '"') state = "closed";
      else value += c;
    } else if (c === sep) push();
    else if (state === "start" && /\s/.test(c)) continue;
    else if (state === "start" && c === '"') state = "quoted";
    else if (state === "closed" && /\s/.test(c)) continue;
    else {
      if (c === '"' || state === "closed")
        error = "CSV mal formé : guillemets invalides";
      value += c;
      state = "unquoted";
    }
  }
  if (state === "quoted") error = "CSV mal formé : guillemets invalides";
  push();
  return { values, error };
}

const importText = (value) => (typeof value === "string" ? value.trim() : "");
const importEmail = (value) => importText(value).toLowerCase();
const normalizedImportName = (value) =>
  importText(value).replace(/\s+/g, " ").toLocaleLowerCase("fr");

function validImportEmail(email) {
  if (!CSV_EMAIL.test(email)) return false;
  const [local, domain] = email.split("@");
  const labels = domain.split(".");
  return (
    !local.startsWith(".") &&
    !local.endsWith(".") &&
    !local.includes("..") &&
    labels.length > 1 &&
    labels.every(
      (label) =>
        /^[\p{L}\p{M}\p{N}-]+$/u.test(label) &&
        !label.startsWith("-") &&
        !label.endsWith("-"),
    )
  );
}

function importIndex(items, key) {
  const index = new Map();
  for (const item of items) {
    const k = key(item);
    if (!k) continue;
    if (!index.has(k)) index.set(k, []);
    index.get(k).push(item);
  }
  return index;
}

// Même contrôle pour l’aperçu et la confirmation, sur l’état courant.
function validateImportRows(s, rows) {
  const studentsByEmail = importIndex(s.students, (x) => importEmail(x?.email));
  const studentsById = importIndex(s.students, (x) => x?.id);
  const usersByEmail = importIndex(s.users, (x) => importEmail(x?.email));
  const usersById = importIndex(s.users, (x) => x?.id);
  const studentsByUser = importIndex(s.students, (x) => x?.user);
  const seen = new Set();
  return rows.map((input) => {
    const row =
      input && typeof input === "object" && !Array.isArray(input) ? input : {};
    const nom = importText(row.nom),
      email = importEmail(row.email),
      promotion = importText(row.promotion).toUpperCase(),
      ville = importText(row.ville);
    const statut = csvStatus(row.statut) || "";
    const students = studentsByEmail.get(email) || [];
    const users = usersByEmail.get(email) || [];
    const syntaxError = csvSyntaxErrors.get(row) || "";
    const preview = csvPreview.get(row);
    const previewError = row.error
      ? importReasons.has(row.error)
        ? row.error
        : "Ligne rejetée à l’aperçu"
      : "";
    let error = syntaxError || preview?.error || previewError;
    if (!error) {
      if (!nom) error = "Nom manquant";
      else if (/[\r\n]/.test(row.nom)) error = "Nom invalide";
      else if (
        (typeof row.email === "string" && /[\r\n]/.test(row.email)) ||
        !validImportEmail(email)
      ) error = "E-mail invalide";
      else if (!["M1", "M2"].includes(promotion) || /[\r\n]/.test(row.promotion))
        error = "Promotion attendue : M1 ou M2";
      else if (
        row.ville != null &&
        (typeof row.ville !== "string" || /[\r\n]/.test(row.ville))
      ) error = "Ville invalide";
      else if (importText(row.statut) && !statut) error = "Statut étudiant inconnu";
      else if (seen.has(email)) error = "Doublon dans le fichier";
      else if (students.length > 1)
        error = "E-mail ambigu dans les dossiers existants";
      else if (users.length > 1)
        error = "E-mail ambigu dans les comptes existants";
      else if (
        students.length &&
        (typeof students[0].id !== "string" ||
          !students[0].id.trim() ||
          (studentsById.get(students[0].id) || []).length !== 1)
      )
        error = "Identifiant de dossier existant incohérent";
      else if (
        preview &&
        (preview.nom !== nom ||
          preview.email !== email ||
          preview.promotion !== promotion ||
          preview.ville !== ville ||
          preview.statut !== statut ||
          (statut && preview.previousStatus !== students[0]?.status) ||
          preview.student !== (students[0]?.id ?? null) ||
          preview.user !== (students[0]?.user ?? null))
      )
        error = "Ligne ou identité modifiée depuis l’aperçu";
      else {
        const student = students[0];
        if (student?.user) {
          const linked = usersById.get(student.user) || [];
          if (
            linked.length !== 1 ||
            users.length !== 1 ||
            linked[0] !== users[0] ||
            !Array.isArray(linked[0].roles) ||
            !linked[0].roles.includes("student") ||
            (studentsByUser.get(student.user) || []).length !== 1
          )
            error = "Compte étudiant lié incohérent";
          else if (
            !normalizedImportName(linked[0].name) ||
            normalizedImportName(nom) !== normalizedImportName(linked[0].name)
          )
            error = "Nom différent du compte étudiant lié";
        } else if (users.length)
          error = "E-mail déjà utilisé par un compte non lié";
      }
    }
    // Une ligne rejetée ne réserve pas l’adresse au détriment d’une ligne valide ultérieure.
    if (!error) seen.add(email);
    const result = {
      ...row,
      nom,
      email,
      promotion,
      ville,
      statut: statut || importText(row.statut),
      error,
      kind: students.length ? "Mise à jour" : "Création",
    };
    if (syntaxError) csvSyntaxErrors.set(result, syntaxError);
    return result;
  });
}

function parseCSV(text, s) {
  if (typeof text !== "string")
    throw Error("Le contenu CSV doit être du texte.");
  const lines = text.replace(/^\uFEFF/, "").split(/\r\n|\n|\r/);
  const headerLine = lines.findIndex((line) => line.trim());
  const header = headerLine < 0 ? "" : lines[headerLine];
  const candidates = [";", ","].map((sep) => {
    const parsed = parseCSVLine(header, sep);
    return {
      sep,
      ...parsed,
      headers: parsed.values.map((x) => x.toLowerCase()),
    };
  });
  const matches = candidates.filter(
    (x) => !x.error && CSV_REQUIRED.every((k) => x.headers.includes(k)),
  );
  if (!matches.length) {
    if (candidates.some((x) => x.error))
      throw Error("En-tête CSV mal formé : guillemets invalides.");
    throw Error(
      "Colonnes requises : nom, email, promotion. Séparateur : point-virgule ou virgule.",
    );
  }
  if (matches.length > 1) throw Error("En-tête CSV : séparateur ambigu.");
  const chosen = matches[0];
  const { sep, headers } = chosen;
  if (headers.some((h) => !h)) throw Error("En-tête CSV : colonne sans nom.");
  if (new Set(headers).size !== headers.length)
    throw Error("En-tête CSV : colonnes en double.");
  if (headers.some((h) => ["line", "error", "kind"].includes(h)))
    throw Error("En-tête CSV : nom de colonne réservé.");
  const rows = [];
  for (let i = headerLine + 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    if (rows.length === CSV_LIMIT)
      throw Error("L’import doit contenir de 1 à 10 000 lignes.");
    const parsed = parseCSVLine(lines[i], sep);
    const row = {
      ...Object.fromEntries(headers.map((h, j) => [h, parsed.values[j] || ""])),
      line: i + 1,
    };
    const syntaxError =
      parsed.error ||
      (parsed.values.length !== headers.length
        ? "CSV mal formé : nombre de colonnes incorrect"
        : "");
    if (syntaxError) csvSyntaxErrors.set(row, syntaxError);
    rows.push(row);
  }
  const checked = validateImportRows(s, rows);
  const studentsByEmail = importIndex(s.students, (x) => importEmail(x?.email));
  for (const row of checked) {
    const student = studentsByEmail.get(row.email)?.[0];
    csvPreview.set(row, {
      nom: row.nom,
      email: row.email,
      promotion: row.promotion,
      ville: row.ville,
      statut: row.statut,
      previousStatus: student?.status,
      error: row.error,
      student: student?.id ?? null,
      user: student?.user ?? null,
    });
  }
  return checked;
}
function importRows(s, rows, file) {
  requireRole(s, ["stages"]);
  if (!can("stages", "imports", s, "validate"))
    throw Error("Import non autorisé.");
  if (!Array.isArray(rows) || !rows.length || rows.length > CSV_LIMIT)
    throw Error("L’import doit contenir de 1 à 10 000 lignes.");
  rows = validateImportRows(s, rows);
  const studentsByEmail = importIndex(s.students, (x) => importEmail(x?.email));
  const usersById = importIndex(s.users, (x) => x?.id);
  const studentIds = new Set(s.students.map((x) => x?.id));
  const nextSuffix = new Map();
  const counters = { created: 0, updated: 0, rejected: 0 };
  rows.forEach((row) => {
    if (row.error) {
      counters.rejected++;
      return;
    }
    const old = studentsByEmail.get(row.email)?.[0];
    if (old) {
      // Le compte lié fait autorité : ne pas créer deux noms pour la même identité.
      old.name = old.user ? usersById.get(old.user)[0].name : row.nom;
      old.promo = row.promotion;
      if (row.ville) old.city = row.ville;
      if (row.statut) old.status = row.statut;
      counters.updated++;
    } else {
      const baseId = id("s");
      let studentId = baseId,
        suffix = nextSuffix.get(baseId) || 1;
      while (studentIds.has(studentId)) studentId = baseId + "-" + suffix++;
      nextSuffix.set(baseId, suffix);
      studentIds.add(studentId);
      s.students.push({
        id: studentId,
        name: row.nom,
        email: row.email,
        promo: row.promotion,
        contract: "Sans contrat",
        company: "—",
        city: row.ville || "Amiens",
        tutor: null,
        mentor: null,
        status: row.statut || "En recherche",
        step: 0,
        cycle: 1,
        access: "À déclarer",
      });
      counters.created++;
    }
  });
  s.imports.unshift({
    id: id("i"),
    date: new Date().toLocaleString("sv-SE").slice(0, 16),
    author: s.session.user,
    file,
    ...counters,
    reasons: [...new Set(rows.filter((x) => x.error).map((x) => x.error))].join(
      " · ",
    ),
  });
  log(
    s,
    "Import",
    `${counters.created} créations · ${counters.updated} mises à jour · ${counters.rejected} rejets`,
  );
  return counters;
}

// Contrôles structurels seulement : ce ne sont ni des règles métier ni une
// frontière de sécurité. Les champs facultatifs et les valeurs héritées sont
// conservés ; on ne vérifie pas les références entre collections.
const storageRecord = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
const storageStrings = (value, keys) => keys.every((key) => typeof value[key] === "string");
const storagePresent = (value, keys) => keys.every((key) => value[key] != null);
const storageArray = (value, check) => Array.isArray(value) && Array.from(value).every(check);
const storageStringArray = (value) => storageArray(value, (item) => typeof item === "string");
const storageItem = (value, strings, present = []) =>
  storageRecord(value) && storageStrings(value, strings) && storagePresent(value, present);

function compatibleState(value) {
  if (!storageRecord(value) || value.version !== 1) return false;
  const defaults = seed();
  for (const [key, example] of Object.entries(defaults)) {
    if (Array.isArray(example) && !Array.isArray(value[key])) return false;
    if (storageRecord(example) && !storageRecord(value[key])) return false;
  }
  if (!["light", "dark"].includes(value.preferences.theme) ||
      typeof value.preferences.motion !== "boolean" ||
      !Number.isFinite(value.settings.sessionMinutes) || value.settings.sessionMinutes <= 0) return false;
  if (!storageArray(value.users, (u) =>
    storageItem(u, ["id", "name", "email"]) && typeof u.active === "boolean" &&
    storageStringArray(u.roles) && u.roles.every((r) => Object.prototype.hasOwnProperty.call(ROLES, r)))) return false;
  // Une mission peut laisser « contract » absent ; les étudiants importés
  // peuvent ne pas avoir de compte, de dates ni d'adresse.
  if (!storageArray(value.students, (d) =>
    storageItem(d, ["id", "name", "email", "promo", "status", "access"], ["company", "city"]) &&
    Number.isFinite(d.step) && Number.isFinite(d.cycle))) return false;
  if (!storageArray(value.visits, (v) =>
    storageItem(v, ["id", "student", "date", "time", "status"], ["place"]))) return false;
  // Les difficultés, prochaines étapes et retours peuvent manquer dans un
  // brouillon ou après une lecture ; la demande associée est facultative.
  if (!storageArray(value.cra, (c) =>
    storageItem(c, ["id", "student", "status", "date"], ["period", "activities"]))) return false;
  if (!storageArray(value.requests, (q) =>
    storageItem(q, ["id", "student", "date"], ["text", "due"]))) return false;
  if (!storageArray(value.missions, (m) =>
    storageItem(m, ["id", "student", "tutor", "status"], ["title", "description"]) &&
    storageArray(m.history, (h) => storageItem(h, ["decision", "date"], ["reason"])))) return false;
  if (!storageArray(value.reports, (r) =>
    storageItem(r, ["id", "student", "author", "status", "date"], ["text"]) &&
    storageStringArray(r.shared) &&
    storageArray(r.notes, (n) => storageItem(n, ["author"], ["text"])))) return false;
  if (!storageArray(value.crvs, (c) =>
    storageItem(c, ["id", "student", "due"], ["text"]) &&
    storageStringArray(c.visas) &&
    storageArray(c.amendments, (a) => storageItem(a, ["author", "date"], ["text"])) &&
    storageArray(c.versions, (v) => storageItem(v, ["author", "date"], ["before", "after"])) &&
    (c.arbitrationNotes == null || storageArray(c.arbitrationNotes,
      (n) => storageItem(n, ["author", "date"], ["text"]))) &&
    typeof c.delegated === "boolean" && typeof c.disagreement === "boolean")) return false;
  if (!storageArray(value.rooms, (room) =>
    storageItem(room, ["id", "student"]) && Number.isFinite(room.cycle) &&
    typeof room.closed === "boolean" && (room.actors == null || storageStringArray(room.actors)) &&
    storageArray(room.messages, (m) =>
      storageItem(m, ["id", "author", "date"], ["text"]) && storageStringArray(m.recipients)))) return false;
  if (!storageArray(value.notifications, (n) =>
    storageItem(n, ["id", "user", "role"], ["text"]) && typeof n.read === "boolean")) return false;
  // bulkInfo crée des e-mails sans identifiant ; importRows accepte un nom de
  // fichier absent. Les deux variantes doivent rester lisibles.
  if (!storageArray(value.emails, (e) => storageItem(e, ["to", "date"], ["text"]))) return false;
  if (!storageArray(value.decisions, (d) =>
    storageItem(d, ["id", "student", "decision", "author", "status", "date"]))) return false;
  if (!storageArray(value.imports, (i) =>
    storageItem(i, ["id", "date", "author", "reasons"]) &&
    [i.created, i.updated, i.rejected].every(Number.isFinite))) return false;
  if (!storageArray(value.audit, (a) =>
    storageItem(a, ["id", "date", "author", "type", "result", "target"], ["detail"]))) return false;
  if (!storageArray(value.history, (h) => {
    if (!storageItem(h, ["type", "date"])) return false;
    if (h.type === "Permissions" || h.type === "Paramètres")
      return storageStrings(h, ["author"]) && storagePresent(h, ["before", "after", "reason"]);
    if (h.type === "Ancien tuteur") return storageStrings(h, ["student", "tutor"]);
    if (h.type === "Contrat archivé")
      return storageStrings(h, ["student"]) && storagePresent(h, ["before", "reason"]);
    return true; // Autres entrées historiques éventuellement issues d'une ancienne version 1.
  })) return false;
  if (value.session !== null && (!storageRecord(value.session) ||
      typeof value.session.user !== "string" || typeof value.session.role !== "string")) return false;
  return true;
}

function storageCompatibleJSON(raw) {
  try {
    return compatibleState(JSON.parse(raw));
  } catch {
    return false;
  }
}

function readStoredState(host = globalThis) {
  let raw;
  try {
    raw = host.localStorage.getItem(KEY);
  } catch {
    return { state: seed(), issue: "unavailable" };
  }
  if (raw === null) return { state: seed(), issue: null };
  if (storageCompatibleJSON(raw)) return { state: JSON.parse(raw), issue: null };
  // Keep the original value intact so it is not silently replaced.
  return { state: seed(), issue: "incompatible" };
}

function writeStoredState(state, issue, host = globalThis) {
  if (issue === "incompatible") return "incompatible";
  try {
    const storage = host.localStorage;
    // La valeur peut avoir changé depuis la lecture, par exemple dans un autre onglet.
    const original = storage.getItem(KEY);
    if (original !== null && !storageCompatibleJSON(original)) return "incompatible";
    // Une lecture initiale a pu échouer : « unavailable » ne permet pas de la
    // distinguer d'un simple échec d'écriture. Ne pas écraser une valeur qui
    // n'a peut-être jamais été chargée ; une nouvelle lecture peut la reprendre.
    if (issue === "unavailable" && original !== null) return "unavailable";
    const serialized = JSON.stringify(state);
    // Tester la forme effectivement stockée : JSON supprime les undefined et
    // transforme les trous des tableaux et les nombres non finis en null.
    if (!storageCompatibleJSON(serialized)) return "incompatible";
    storage.setItem(KEY, serialized);
    return null;
  } catch {
    return "unavailable";
  }
}

function act(action, p, msg = "Modification enregistrée et tracée.") {
  const before = structuredClone(s);
  // Le domaine peut être mis à jour indépendamment : refuser toute ancienne
  // mutation qui contredirait la confidentialité ou les engagements affichés.
  const intendedRecipients = action === "message" && p.recipients?.length
    ? [...p.recipients].sort() : null;
  const intendedTargets = action === "message" ? structuredClone(p.recipientTargets || []) : [];
  const oldCrv = action === "crvSave"
    ? before.crvs.find((c) => c.student === p.student && (!p.id || c.id === p.id)) : null;
  try {
    mutate(s, action, p);
    if (intendedRecipients) {
      const roomBefore = before.rooms.find((room) => room.id === p.room);
      const roomAfter = s.rooms.find((room) => room.id === p.room);
      const added = roomAfter?.messages.slice(roomBefore?.messages.length ?? 0);
      const actual = added?.length === 1 ? [...added[0].recipients].sort() : [];
      if (JSON.stringify(actual) !== JSON.stringify(intendedRecipients))
        throw Error("Envoi annulé : les destinataires ne correspondent pas à votre sélection. La mise à jour des règles de messagerie est nécessaire.");
      const student = before.students.find((d) => d.id === p.student);
      const possible = student ? roomRecipientTargets(student, before) : [];
      const multiRoleIds = [...new Set(intendedTargets.map((t) => t.user))]
        .filter((id) => possible.filter((t) => t.user === id).length > 1);
      if (multiRoleIds.length) {
        const keys = (items) => items.map((t) => JSON.stringify([t.user, t.role])).sort();
        if (!Array.isArray(added[0].recipientTargets) && !added[0].recipientRoles ||
            added[0].recipientTargets && JSON.stringify(keys(added[0].recipientTargets)) !== JSON.stringify(keys(intendedTargets)))
          throw Error("Envoi annulé : le ciblage par rôle nécessite la mise à jour des règles de messagerie.");
        // Refuser un filtrage encore fondé seulement sur l'identifiant de compte.
        for (const target of possible.filter((t) => multiRoleIds.includes(t.user))) {
          if (intendedTargets.some((t) => t.user === target.user && t.role === target.role)) continue;
          const probe = structuredClone(s);
          probe.session = { user: target.user, role: target.role, lastActivity: Date.now() };
          const probeRoom = probe.rooms.find((room) => room.id === p.room);
          let visible = false;
          try { visible = messages(probe, probeRoom).some((m) => m.id === added[0].id); } catch {}
          if (visible)
            throw Error("Envoi annulé : le filtrage des destinataires par rôle n’est pas encore disponible.");
        }
      }
    }
    if (action === "missionDecision" && p.decision === "Accepter") {
      const oldMission = before.missions.find((m) => m.id === p.id);
      const newMission = s.missions.find((m) => m.id === p.id);
      const oldStudent = before.students.find((d) => d.id === oldMission?.student);
      const newStudent = s.students.find((d) => d.id === oldMission?.student);
      if (!oldStudent || newMission?.status !== "Avis favorable du tuteur" || newStudent?.tutor !== oldStudent.tutor)
        throw Error("Avis non enregistré : les règles de décision finale doivent être mises à jour avant cette action.");
    }
    if (oldCrv) {
      const updated = crvsFor(s).find((c) => c.id === oldCrv.id);
      const changed = updated && (updated.text !== oldCrv.text || (updated.html || "") !== (oldCrv.html || ""));
      if (changed && ((updated.versions || []).length <= (oldCrv.versions || []).length || updated.visas.length))
        throw Error("Modification annulée : la conservation des versions et la remise à zéro des visas doivent être prises en charge par le domaine.");
    }
    save();
    closeDialog();
    render();
    toast(msg);
    return true;
  } catch (e) {
    s = before;
    log(
      s,
      "Action refusée",
      "Action rejetée par les règles : " + action,
      "Échec",
    );
    save();
    const err = document.querySelector(".form-error");
    if (err) {
      err.textContent = e.message;
      err.setAttribute("tabindex", "-1");
      err.focus();
    } else toast(e.message);
    return false;
  }
}

function filterSelect(key, label, values, all = "Tous") {

}

function filteredStudents() {
  return students().filter((d) =>
    Object.entries(filters).every(([k, v]) =>
      !v || k === "alert"
        ? k === "alert" && v
          ? alertMatches(d, v)
          : true
        : d[k] === v,
    ),
  );
}
function alertMatches(d, v) {
  return v === "Sans tuteur"
    ? !d.tutor
    : v === "Rupture"
      ? d.status.includes("Rupture")
      : v === "CRA attendu"
        ? s.requests.some(
            (q) =>
              q.student === d.id &&
              q.type === "CRA" &&
              !crasFor(s).some(
                (c) => c.request === q.id && c.status !== "Brouillon",
              ),
          )
        : v === "Visite à planifier"
          ? !visitsFor(s).some((x) => x.student === d.id)
          : v === "CRV en attente"
            ? crvsFor(s).some((x) => x.student === d.id && x.visas.length < 3)
            : d.status.includes(v);
}

function timeline(d) {

          x.student === d.id &&
          can(role(), "cra", s) &&
          (role() === "student" || x.status !== "Brouillon"),

      .map((x) => ({

          (role() === "student" ? "Mon dépôt" : "Dépôt étudiant") +

          x.period,

        status: x.status,
      })),
    ...crvsFor(s)
      .filter((x) => x.student === d.id && can(role(), "crv", s))
      .map((x) => ({

// Un compte peut représenter plusieurs acteurs du même dossier : chaque
// couple compte/rôle est un destinataire distinct.
function roomRecipientTargets(d, state = s) {
  const all = [
    { user: d.user, role: "student" },
    { user: d.tutor, role: "tutor" },
    { user: d.mentor, role: "company" },
    ...state.users.filter((u) => u.active && u.roles.includes("stages"))
      .map((u) => ({ user: u.id, role: "stages" })),
  ];
  const seen = new Set();
  return all.filter((target) => {
    const account = state.users.find((u) => u.id === target.user && u.active && u.roles.includes(target.role));
    const key = JSON.stringify([target.user, target.role]);
    if (!account || target.user === state.session?.user || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function inPeriod(date, period) {
  if (!period) return true;
  const match = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(date));
  if (!match) return false;
  const today = new Date();
  const currentDay = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());
  const eventDay = Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
  const diff = (currentDay - eventDay) / 86400000;
  return period === "Aujourd’hui"
    ? diff === 0
    : diff >= 0 && diff < (period === "7 derniers jours" ? 7 : 30);
}

function csvDownload(filename, headers, rows) {
  const cell = (x) => {
    let v = String(x ?? "");
    if (/^[\t\r\n]|^[\x00-\x20]*[=+@\-]/.test(v)) v = "'" + v;
    return '"' + v.replaceAll('"', '""') + '"';
  };
  download(
    filename,
    "\uFEFF" +
      [headers, ...rows].map((r) => r.map(cell).join(";")).join("\r\n"),
    "text/csv;charset=utf-8",
  );
}
function download(filename, body, type = "text/plain") {
  const blob = new Blob([body], { type }),
    url = URL.createObjectURL(blob),
    a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("Fichier préparé : " + filename);
}

function exportIcs(vid) {
  const v = visitsFor(s).find(
    (x) => x.id === vid && students().some((d) => d.id === x.student),
  );
  if (!v) return toast("Visite hors périmètre.");
  const clean = (x) =>
    String(x)
      .replaceAll("\\", "\\\\")
      .replaceAll(";", "\\;")
      .replaceAll(",", "\\,")
      .replace(/\r\n|\r|\n/g, "\\n");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v.date) || !/^([01]\d|2[0-3]):[0-5]\d$/.test(v.time))
    return toast("Date ou heure de visite invalide ; export impossible.");
  const start = v.date.replaceAll("-", "") + "T" + v.time.replace(":", "") + "00";
  // Add one wall-clock hour, including the transition to the next calendar day.
  const [year, month, day] = v.date.split("-").map(Number);
  const [hour, minute] = v.time.split(":").map(Number);
  const endDate = new Date(Date.UTC(year, month - 1, day, hour + 1, minute));
  const end = endDate.toISOString().replace(/[-:]/g, "").slice(0, 15);
  download(
    "visite-miage.ics",
    [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//UPJV//Suivi MIAGE//FR",
      "BEGIN:VTIMEZONE",
      "TZID:Europe/Paris",
      "BEGIN:DAYLIGHT",
      "DTSTART:19960331T020000",
      "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU",
      "TZOFFSETFROM:+0100",
      "TZOFFSETTO:+0200",
      "TZNAME:CEST",
      "END:DAYLIGHT",
      "BEGIN:STANDARD",
      "DTSTART:19961027T030000",
      "RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU",
      "TZOFFSETFROM:+0200",
      "TZOFFSETTO:+0100",
      "TZNAME:CET",
      "END:STANDARD",
      "END:VTIMEZONE",
      "BEGIN:VEVENT",
      "UID:" + v.id + "@miage.local",
      "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}Z$/, "Z"),
      "DTSTART;TZID=Europe/Paris:" + start,
      "DTEND;TZID=Europe/Paris:" + end,
      "SUMMARY:" + clean("Visite MIAGE · " + dname(v.student)),
      "LOCATION:" + clean(v.place),
      "END:VEVENT",
      "END:VCALENDAR",
    ].join("\r\n"),
    "text/calendar;charset=utf-8",
  );
}

          localStorage.removeItem(KEY);

      default:

    }
  } catch (error) {
    if (err) {
      err.textContent = error.message;
      err.tabIndex = -1;
      err.focus();
    } else toast(error.message);
  }

      form = el.closest("form");
    if (d)
      for (const key of [
        "company",
        "city",
        "address",
        "start",
        "end",
        "contract",
      ])
        if (form.elements[key])
          form.elements[key].value = d[key] === "—" ? "" : d[key] || "";
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (overlay.innerHTML) closeDialog();
    const sidebar = document.querySelector(".sidebar");
    const wasOpen = sidebar?.classList.contains("open");
    sidebar?.classList.remove("open");
    const menu = document.querySelector(".mobile-menu");
    menu?.setAttribute("aria-expanded", "false");
    if (wasOpen) menu?.focus();
  }
  if (e.key === "Tab" && overlay.innerHTML) {
    const root = overlay.querySelector("[role=dialog]"),
      items = [
        ...root.querySelectorAll(
          'button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]',
        ),
      ].filter((el) => el.offsetParent !== null),
      first = items[0],
      last = items.at(-1);
    if (
      e.shiftKey &&
      (document.activeElement === first || document.activeElement === root)
    ) {
      e.preventDefault();
      last?.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first?.focus();
    }
  }
  if (
    e.target.getAttribute("role") === "tab" &&
    ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)
  ) {
    e.preventDefault();
    const items = [...e.target.parentNode.children],
      i = items.indexOf(e.target),
      next =
        e.key === "Home"
          ? 0
          : e.key === "End"
            ? items.length - 1
            : (i + (e.key === "ArrowRight" ? 1 : -1) + items.length) %
              items.length;
    const tabId = items[next].dataset.tab;
    handleAction("tab", items[next]);
    document.querySelector(`[role=tab][data-tab="${tabId}"]`)?.focus();
  }
  if (e.key === "Enter" && e.target.matches("tr[data-action]")) {
    e.preventDefault();
    handleAction(e.target.dataset.action, e.target);
  }
});
let lastPersist = 0;
function recordActivity() {
  if (externalConflict) return;
  if (s.session) {
    const now = Date.now();
    if (now - s.session.lastActivity > s.settings.sessionMinutes * 60000) {
      s.session = null;
      save();
      closeDialog();
      render();
      toast("Session expirée. Veuillez vous reconnecter.");
      return;
    }
    s.session.lastActivity = now;
    if (now - lastPersist > 10000) {
      save();
      lastPersist = now;
    }
  }
}
for (const type of ["pointerdown", "keydown", "input"]) {
  document.addEventListener(type, recordActivity);
}
setInterval(() => {
  if (
    s.session &&
    Date.now() - s.session.lastActivity > s.settings.sessionMinutes * 60000
  ) {
    s.session = null;
    save();
    closeDialog();
    render();
    toast("Session expirée après inactivité.");
  }
}, 30000);
function onlyActivityChanged(oldRaw, newRaw) {
  try {
    const before = JSON.parse(oldRaw), after = JSON.parse(newRaw);
    if (!before?.session || !after?.session) return false;
    delete before.session.lastActivity;
    delete after.session.lastActivity;
    return JSON.stringify(before) === JSON.stringify(after);
  } catch { return false; }
}
window.addEventListener("storage", (e) => {
  if (e.key !== KEY) return;
  const incoming = readStoredState();
  if (onlyActivityChanged(e.oldValue, e.newValue)) {
    if (!externalConflict && s.session && incoming.state.session)
      s.session.lastActivity = Math.max(s.session.lastActivity, incoming.state.session.lastActivity);
    return;
  }
  const currentSession = s.session && `${s.session.user}|${s.session.role}`;
  const nextSession = incoming.state.session && `${incoming.state.session.user}|${incoming.state.session.role}`;
  const editing = !!overlay.querySelector("form") || !!app.querySelector("main form") ||
    !!permissionDraft || (page === "imports" && !!importData);
  if (editing && (incoming.issue !== null || currentSession === nextSession)) {
    externalConflict = true;
    const status = document.querySelector("#storage-status");
    if (status) status.innerHTML = storageMessage();
    const body = overlay.querySelector(".dialog-body");
    if (body && !body.querySelector(".external-change-notice"))
      body.insertAdjacentHTML("afterbegin", storageMessage());
    toast("Données modifiées ailleurs : copiez votre saisie, puis rechargez.");
    return;
  }
  ({ state: s, issue: storageIssue } = incoming);
  externalConflict = false;
  closeDialog();
  page = "home";
  tab = "";
  filters = {};
  selected.clear();
  detailId = null;
  permissionDraft = null;
  importData = null;
  importStep = 1;
  roomChannel = "general";
  render();
});
render();

document.addEventListener("mousedown", (e) => {
  if (e.target.closest(".rich-toolbar")) e.preventDefault();
});
document.addEventListener("paste", (e) => {
  if (e.target.closest(".rich-content")) {
    e.preventDefault();
    document.execCommand(
      "insertText",
      false,
      e.clipboardData.getData("text/plain"),
    );
  }
});

if (!s.session) authenticate("admin");
if (role() === "admin") goto("settings");
})();
</script>
